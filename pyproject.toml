[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "plantbrain"
version = "0.1.0"
description = "A data-driven plant care system with explainable statistical and rule-based insights."
requires-python = ">=3.13"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "SQLAlchemy==2.0.51",
    "alembic==1.19.0",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
]


[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]


[tool.setuptools.packages.find]
include = ["app*"]
exclude = [
    "frontend*",
    "migrations*",
    "scripts*",
    "tests*",
    "docs*",
]


[tool.ruff]
line-length = 100
target-version = "py313"


[tool.pytest.ini_options]
testpaths = ["tests"]
